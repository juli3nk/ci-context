name: 'CI Context Detector'
description: 'Detects the git context and exposes normalized refs'

inputs:
  base_ref:
    description: "Forced base reference (optional). When empty, ci-context auto-detects the base."
    required: false
    type: string
    default: ""
  since:
    description: "Minimum reference commit; base_ref will never be older than this commit"
    required: false
    type: string
    default: ""

outputs:
  base_ref:
    description: 'Base reference'
    value: ${{ steps.detect.outputs.base_ref }}
  head_ref:
    description: 'HEAD reference'
    value: ${{ steps.detect.outputs.head_ref }}
  commit_count:
    description: 'Number of commits in the change range'
    value: ${{ steps.detect.outputs.commit_count }}

runs:
  using: composite
  steps:
    - id: detect
      run: |
        VERSION="v0.1.0"
        VERSION_NO_V="${VERSION#v}"
        ARCH_RAW=$(uname -m)
        case "$ARCH_RAW" in
          x86_64)  ARCH="linux_amd64" ;;
          aarch64|arm64) ARCH="linux_arm64" ;;
          *) echo "Unsupported architecture: $ARCH_RAW"; exit 1 ;;
        esac

        TARBALL="ci-context_${VERSION_NO_V}_${ARCH}.tar.gz"
        DOWNLOAD_URL="https://github.com/juli3nk/ci-context/releases/download/${VERSION}/${TARBALL}"
        CHECKSUM_URL="https://github.com/juli3nk/ci-context/releases/download/${VERSION}/ci-context_${VERSION_NO_V}_checksums.txt"

        tmpdir="$(mktemp -d)"
        trap 'rm -rf "$tmpdir"' EXIT

        curl -fsSL "$DOWNLOAD_URL" -o "${tmpdir}/${TARBALL}"
        curl -fsSL "$CHECKSUM_URL" -o "${tmpdir}/checksums.txt"

        (
          cd "$tmpdir"
          grep " ${TARBALL}$" checksums.txt | sha256sum -c -
        )

        tar -xzf "${tmpdir}/${TARBALL}" -C "$tmpdir"

        args=()
        if [ "${{ inputs.base_ref }}" != "" ]; then
          args+=("--base-ref=${{ inputs.base_ref }}")
        fi
        if [ "${{ inputs.since }}" != "" ]; then
          args+=("--since=${{ inputs.since }}")
        fi

        cd "${{ github.workspace }}"
        "${tmpdir}/ci-context" "${args[@]}" --github-output >> "$GITHUB_OUTPUT"
      shell: bash
